name: Build and Deploy to Build Branch

on:
  push:
    branches:
      - main
  # Permette l'esecuzione manuale dal tasto "Run workflow" su GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy dist to build branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          target-folder: dist
          branch: build
